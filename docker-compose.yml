version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_video_app
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "user"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI

  prisma-studio:
    image: node:18-alpine
    working_dir: /workspace
    command: sh -c "npx prisma generate && npx prisma studio --port 5556"
    ports:
      - "5556:5556"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./prisma:/workspace/prisma:ro
      - ./node_modules:/workspace/node_modules
    environment:
      DATABASE_URL: "postgresql://user:password@db:5432/ai_video_app?schema=public"
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      PRISMA_ENGINES_CHECKSUM_IGNORE: 1
      PRISMA_CLI_NO_ENGINE_CHECK: 1

  app-dev:
    build:
      context: .
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: "postgresql://user:password@db:5432/ai_video_app?schema=public"
      REDIS_URL: "redis://redis:6379"
      # Route emails to MailHog in dev
      SMTP_HOST: "mailhog"
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASS: ""
      MAIL_FROM: "no-reply@ai-video-app.com"
      NODE_TLS_REJECT_UNAUTHORIZED: 0
      PRISMA_ENGINES_CHECKSUM_IGNORE: 1
      PRISMA_CLI_NO_ENGINE_CHECK: 1
      # Video generation settings
      USE_MOCK_VIDEO: "true"
      # Auth & Security
      JWT_SECRET: "replace_me_dev_secret_key_change_in_production"
      # Cloudflare R2 Storage
      R2_ENDPOINT: "https://c5f48a82dab81ee223aa84f4b9917291.r2.cloudflarestorage.com"
      R2_REGION: "auto"
      R2_BUCKET: "your-bucket-name"
      R2_PUBLIC_BASE: "https://your-custom-domain.com"
      R2_ACCESS_KEY_ID: "your_r2_access_key_id"
      R2_SECRET_ACCESS_KEY: "your_r2_secret_access_key"
    ports:
      - "3000:3000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./public:/app/public
      - ./EMAIL_OTP_SETUP.md:/app/EMAIL_OTP_SETUP.md:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started

  app:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://user:password@db:5432/ai_video_app?schema=public"
      REDIS_URL: "redis://redis:6379"
      SMTP_HOST: "smtp.gmail.com"
      SMTP_PORT: 587
      SMTP_USER: "your-email@gmail.com"
      SMTP_PASS: "your-app-password"
      MAIL_FROM: "no-reply@ai-video-app.com"
      # Video generation settings
      USE_MOCK_VIDEO: "true"
      # Auth & Security
      JWT_SECRET: "replace_me_production_secret_key_change_this"
      # Cloudflare R2 Storage
      R2_ENDPOINT: "https://c5f48a82dab81ee223aa84f4b9917291.r2.cloudflarestorage.com"
      R2_REGION: "auto"
      R2_BUCKET: "your-bucket-name"
      R2_PUBLIC_BASE: "https://your-custom-domain.com"
      R2_ACCESS_KEY_ID: "your_r2_access_key_id"
      R2_SECRET_ACCESS_KEY: "your_r2_secret_access_key"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pgdata:
